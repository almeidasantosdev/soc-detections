title: Linux SSH Brute Force
id: 7c1a9b2e-4d55-4f0a-9c11-socn1-ssh-bf
status: experimental
description: Detects multiple failed SSH authentication attempts from a single source IP.
author: almeidasantosdev
date: 2026/03/23
references:
  - https://attack.mitre.org/techniques/T1110/
logsource:
  product: linux
  service: auth
detection:
  selection:
    pam_message|contains:
      - 'Failed password'
      - 'Invalid user'
  timeframe: 5m
  condition: selection | count() by src_ip > 5
falsepositives:
  - Vulnerability scanners with approved tickets
  - Misconfigured automation / Ansible retries
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - soc.n1
